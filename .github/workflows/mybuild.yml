name: MyBuild
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      STORE_PASSWORD: flowbuild
      KEY_ALIAS: flow
      KEY_PASSWORD: flowbuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: git apply flow-spacing-avatar-fix.patch
      - run: chmod +x gradlew
      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Flow Local Build"
      - name: Build release
        run: |
          for i in 1 2 3; do
            ./gradlew :app:assembleGithubRelease --no-configuration-cache \
              -Dorg.gradle.internal.http.connectionTimeout=180000 \
              -Dorg.gradle.internal.http.socketTimeout=180000 \
              -Dorg.gradle.internal.repository.max.retries=10 && exit 0
            echo "Attempt $i failed"
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: flow-release
          path: app/build/outputs/apk/github/release/*.apk
